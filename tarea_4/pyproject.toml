[project]
name = "mcp-bcrp"
version = "0.1.0"
description = "Servidor MCP con las series oficiales del BCRP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4,<5",
    "geopandas>=1.2.0",
    "httpx",
    "matplotlib>=3.11.2",
    "pandas",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest"]
